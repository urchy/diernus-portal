<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Esqueci-me da palavra-passe · Diernus Portal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/style.css">
  <meta name="api-base" content="https://diernus-portal-api.diernus.com">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%232C49C7'/%3E%3Ctext x='32' y='45' font-family='monospace' font-weight='bold' font-size='38' fill='%23EDEAE3' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-shell-single">
    <div class="auth-card">
      <span class="eyebrow">Diernus · Portal</span>
      <h1>Esqueci-me da palavra-passe</h1>
      <p class="lede">Indique o email associado à sua conta. Se existir, enviaremos um link para definir uma nova palavra-passe. O link expira em 15 minutos.</p>

      <div id="err" class="error" style="display:none"></div>

      <form id="form" novalidate>
        <label class="field">
          <label>Email</label>
          <input type="email" name="email" required autocomplete="email">
        </label>
        <button class="btn primary" type="submit" id="submit" style="width:100%;justify-content:center;padding:.7rem">Enviar link de recuperação</button>
      </form>

      <p style="margin-top:1.4rem;font-size:.88rem;color:var(--graphite-60);text-align:center">
        <a href="/login.html" style="color:var(--clay);font-weight:600">← Voltar ao início de sessão</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { api } from '/shared/api.js';
    const form = document.getElementById('form');
    const err  = document.getElementById('err');
    const btn  = document.getElementById('submit');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'A enviar…';
      const email = new FormData(form).get('email');
      try {
        // Always 200 regardless of whether the email exists. Show a
        // success state that mentions the 15-min window — keeps the UX
        // consistent while not leaking whether the account exists.
        await api.forgotPassword(email);
        const card = document.querySelector('.auth-card');
        card.innerHTML = `
          <span class="eyebrow" style="color:#1e8e3e">Diernus · Enviado</span>
          <h1>Verifique a sua caixa de entrada</h1>
          <p class="lede">Se <b>${escapeHtml(email)}</b> estiver associado a uma conta, receberá um link para definir uma nova palavra-passe. O link expira em 15 minutos.</p>
          <p class="lede" style="font-size:.85rem;color:var(--graphite-60);margin-top:1rem">Não recebeu nada? Verifique a pasta de spam ou <a href="/forgot-password.html" style="color:var(--clay);font-weight:600">tente novamente</a> em 15 minutos.</p>
          <p style="margin-top:1.4rem"><a href="/login.html" style="color:var(--clay);font-weight:600;font-size:.88rem">← Voltar ao início de sessão</a></p>
        `;
      } catch (e) {
        err.textContent = e.message;
        err.style.display = '';
        btn.disabled = false; btn.textContent = 'Enviar link de recuperação';
      }
    });
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
