<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Projetos · Diernus Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- API base: change ONE LINE at cutover (matches login.html). -->
  <meta name="api-base" content="https://diernus-portal-api.diernus.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%232C49C7'/%3E%3Ctext x='32' y='45' font-family='monospace' font-weight='bold' font-size='38' fill='%23EDEAE3' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main id="app"></main>
  <div class="modal-back" id="modalBack">
    <div class="modal">
      <h2>+ Projeto</h2>
      <div class="error" id="err" style="display:none"></div>
      <form id="form">
        <label class="field"><label>Cliente</label><select name="client_id" id="clientSel" required></select></label>
        <label class="field"><label>Nome do projeto</label><input type="text" name="name" required></label>
        <label class="field"><label>Descrição (opcional)</label><textarea name="description" rows="3"></textarea></label>
        <div class="row" style="display:flex;gap:.55rem">
          <button type="button" class="btn ghost" id="cancel" style="flex:1;justify-content:center;padding:.55rem">Cancelar</button>
          <button type="submit" class="btn primary" id="submit" style="flex:1;justify-content:center;padding:.55rem">Criar projeto</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module">
    import { renderLayout, timeAgo, pageLoading, safeRender, showToast } from '/shared/layout.js';
    import { api } from '/shared/api.js';
    const { content } = await renderLayout({ active: 'projects', crumbs: ['Projetos'] });
    const loading = pageLoading(content, 'A carregar projetos…');
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // ------------------------------------------------------------------
    // State — fetched once, filtered client-side (project lists are small)
    // ------------------------------------------------------------------
    let allProjects = [];   // canonical list from the server
    let filterStatus = 'all';
    let filterSearch = '';
    let filterDue    = 'all';

    // ------------------------------------------------------------------
    // Page chrome (rendered once, stable across re-renders)
    // ------------------------------------------------------------------
    content.innerHTML = `
      <div class="page-head">
        <div>
          <span class="eyebrow">Projetos</span>
          <h1 id="projCount">…</h1>
          <p class="lede">Crie projetos para os seus clientes. Cada projeto traz um kanban (A Fazer / Em Curso / Concluído) onde pode adicionar cartões e onde o cliente pode comentar.</p>
        </div>
        <div class="actions"><button class="btn primary" id="newProject">+ Novo projeto</button></div>
      </div>
      <div class="proj-filters">
        <div class="proj-filters-row">
          <input type="search" id="projSearch" class="proj-search" placeholder="Pesquisar por nome, cliente ou email…" autocomplete="off">
          <select id="projDue" class="proj-due-sel" title="Filtrar por prazo">
            <option value="all">Prazo: todos</option>
            <option value="none">Sem prazo</option>
            <option value="overdue">Atrasados</option>
            <option value="week">Vence esta semana</option>
            <option value="month">Vence este mês</option>
            <option value="future">Mais de 30 dias</option>
          </select>
        </div>
        <div class="proj-tabs" id="projTabs" role="tablist">
          <button type="button" class="proj-tab is-active" data-status="all"      role="tab">Todos      <span class="proj-tab-n" data-cnt="all">0</span></button>
          <button type="button" class="proj-tab"           data-status="active"   role="tab">Ativos     <span class="proj-tab-n" data-cnt="active">0</span></button>
          <button type="button" class="proj-tab"           data-status="completed" role="tab">Concluídos <span class="proj-tab-n" data-cnt="completed">0</span></button>
          <button type="button" class="proj-tab"           data-status="archived"  role="tab">Arquivados <span class="proj-tab-n" data-cnt="archived">0</span></button>
        </div>
      </div>
      <div id="projTable"></div>
    `;

    document.getElementById('newProject').addEventListener('click', openModal);

    // Filter wiring
    document.getElementById('projSearch').addEventListener('input', e => {
      filterSearch = (e.target.value || '').trim().toLowerCase();
      applyFilters();
    });
    document.getElementById('projDue').addEventListener('change', e => {
      filterDue = e.target.value;
      applyFilters();
    });
    document.getElementById('projTabs').addEventListener('click', e => {
      const tab = e.target.closest('.proj-tab');
      if (!tab) return;
      filterStatus = tab.dataset.status;
      for (const t of document.querySelectorAll('.proj-tab')) t.classList.remove('is-active');
      tab.classList.add('is-active');
      applyFilters();
    });

    // ------------------------------------------------------------------
    // Filtering
    // ------------------------------------------------------------------
    function dueBucket(project) {
      if (!project.due_date) return 'none';
      const d = new Date(project.due_date);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = Math.round((d - today) / 86400000);
      if (days < 0) return 'overdue';
      if (days <= 7)  return 'week';
      if (days <= 30) return 'month';
      return 'future';
    }

    function matchesSearch(p, q) {
      if (!q) return true;
      return (p.name || '').toLowerCase().includes(q)
          || (p.client_name  || '').toLowerCase().includes(q)
          || (p.client_email || '').toLowerCase().includes(q)
          || (p.description  || '').toLowerCase().includes(q);
    }

    function applyFilters() {
      // Per-status counts respect the search + due filters (so the tabs
      // show "if I switch to this tab, how many would I see?")
      const counts = { all: 0, active: 0, completed: 0, archived: 0 };
      const filtered = [];
      for (const p of allProjects) {
        if (!matchesSearch(p, filterSearch)) continue;
        if (filterDue !== 'all' && dueBucket(p) !== filterDue) continue;
        counts.all++;
        counts[p.status] = (counts[p.status] || 0) + 1;
        if (filterStatus === 'all' || p.status === filterStatus) filtered.push(p);
      }
      // Update tab badges
      for (const el of document.querySelectorAll('.proj-tab-n')) {
        el.textContent = counts[el.dataset.cnt] || 0;
      }
      renderTable(filtered, counts);
    }

    function renderTable(filtered, counts) {
      const tableHost = document.getElementById('projTable');
      const heading = document.getElementById('projCount');
      const total = allProjects.length;
      const visible = filtered.length;
      const filtersActive = filterSearch !== '' || filterDue !== 'all' || filterStatus !== 'all';

      // Heading: "X projetos" or "X de Y projetos" when filtered.
      heading.textContent = filtersActive
        ? `${visible} de ${total} ${total === 1 ? 'projeto' : 'projetos'}`
        : `${total} ${total === 1 ? 'projeto' : 'projetos'}`;

      if (allProjects.length === 0) {
        tableHost.innerHTML = '<div class="empty"><div class="empty-title">Sem projetos ainda</div><div class="empty-sub">Crie um cliente primeiro em <a href="/admin/clientes.html">Clientes</a>, depois crie um projeto para esse cliente.</div></div>';
        return;
      }
      if (filtered.length === 0) {
        tableHost.innerHTML = '<div class="empty"><div class="empty-title">Nenhum projeto corresponde aos filtros</div><div class="empty-sub">Tente alargar a pesquisa, escolher outro estado ou limpar o filtro de prazo.</div></div>';
        return;
      }

      tableHost.innerHTML = `<table class="table">
        <thead><tr><th>Nome</th><th>Cliente</th><th>Prazo</th><th>€/h</th><th>Estado</th><th>Atualizado</th><th class="row-actions"></th></tr></thead>
        <tbody>${filtered.map(p => {
          const due = p.due_date
            ? (() => { const d = new Date(p.due_date); const t = new Date(); t.setHours(0,0,0,0); const days = Math.round((d - t) / 86400000);
                return `<span class="mono" style="font-size:.78rem${days < 0 ? ';color:var(--stamp);font-weight:500' : days <= 7 ? ';color:var(--amber)' : ''}">${d.toLocaleDateString('pt-PT', { day: '2-digit', month: 'short', year: 'numeric' })}${days < 0 ? ` · ${Math.abs(days)}d atrasado` : days === 0 ? ' · hoje' : days === 1 ? ' · amanhã' : ''}</span>`; })()
            : '<span class="mono" style="font-size:.78rem;color:var(--graphite-60)">—</span>';
          return `
            <tr>
              <td class="name"><a href="/admin/projeto.html?id=${encodeURIComponent(p.id)}">${escapeHtml(p.name)}</a>${p.description ? `<small>${escapeHtml(p.description)}</small>` : ''}</td>
              <td>${escapeHtml(p.client_name)}<br><span class="mono" style="font-size:.75rem;color:var(--graphite-60)">${escapeHtml(p.client_email)}</span></td>
              <td>${due}</td>
              <td>${p.hourly_rate != null ? `<span class="mono" style="font-size:.78rem">${Number(p.hourly_rate).toFixed(2).replace(/\.00$/, '')} €/h</span>` : '<span class="mono" style="color:var(--graphite-60);font-size:.78rem">—</span>'}</td>
              <td><span class="status-pill ${p.status === 'active' ? 'online' : p.status === 'completed' ? 'active' : 'suspended'}">${p.status === 'active' ? 'em curso' : p.status === 'completed' ? 'concluído' : p.status}</span></td>
              <td><span class="mono" style="color:var(--graphite-60);font-size:.8rem">${timeAgo(p.updated_at)}</span></td>
              <td class="row-actions"><a class="btn sm primary" href="/admin/projeto.html?id=${encodeURIComponent(p.id)}">Abrir ›</a></td>
            </tr>`;
        }).join('')}</tbody>
      </table>`;
    }

    // ------------------------------------------------------------------
    // Initial load + refresh on create
    // ------------------------------------------------------------------
    async function loadProjects() {
      const { projects } = await api.projects();
      allProjects = projects;
      applyFilters();
    }

    function openModal() {
      document.getElementById('form').reset();
      document.getElementById('err').style.display = 'none';
      document.getElementById('modalBack').classList.add('on');
      api.clients().then(({ clients }) => {
        const sel = document.getElementById('clientSel');
        const active = clients.filter(c => c.status === 'active');
        if (!active.length) {
          sel.innerHTML = '<option value="">— sem clientes ativos —</option>';
          document.getElementById('submit').disabled = true;
        } else {
          sel.innerHTML = '<option value="">— escolha um cliente —</option>' +
            active.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${escapeHtml(c.email)})</option>`).join('');
          document.getElementById('submit').disabled = false;
        }
      });
    }
    function closeModal() { document.getElementById('modalBack').classList.remove('on'); }
    document.getElementById('cancel').addEventListener('click', closeModal);
    document.getElementById('modalBack').addEventListener('click', e => { if (e.target.id === 'modalBack') closeModal(); });

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const data = new FormData(e.target);
      const submit = document.getElementById('submit');
      submit.disabled = true; submit.textContent = 'A criar…';
      try {
        await api.createProject(data.get('client_id'), data.get('name'), data.get('description'));
        closeModal();
        // Switch to the "all" tab + clear other filters so the new project is
        // visible immediately. (Most users want to see what they just made.)
        filterSearch = '';
        filterDue = 'all';
        filterStatus = 'all';
        document.getElementById('projSearch').value = '';
        document.getElementById('projDue').value = 'all';
        for (const t of document.querySelectorAll('.proj-tab')) t.classList.remove('is-active');
        const allTab = document.querySelector('.proj-tab[data-status="all"]');
        if (allTab) allTab.classList.add('is-active');
        await loadProjects();
        showToast('Projeto criado');
      } catch (err) {
        const el = document.getElementById('err');
        el.textContent = err.message; el.style.display = '';
      } finally {
        submit.disabled = false; submit.textContent = 'Criar projeto';
      }
    });

    safeRender(loading, loadProjects);
  </script>
</body>
</html>
