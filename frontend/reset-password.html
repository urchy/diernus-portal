<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Definir nova palavra-passe · Diernus Portal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/style.css">
  <meta name="api-base" content="https://diernus-portal-api.diernus.com">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%232C49C7'/%3E%3Ctext x='32' y='45' font-family='monospace' font-weight='bold' font-size='38' fill='%23EDEAE3' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <span class="eyebrow">Diernus · Portal</span>
      <h1>Definir nova palavra-passe</h1>
      <p class="lede">A sua nova palavra-passe deve ter pelo menos 8 caracteres. As outras sessões abertas serão terminadas.</p>

      <div id="err" class="error" style="display:none"></div>

      <form id="form" novalidate>
        <label class="field">
          <label>Nova palavra-passe</label>
          <input type="password" name="newPassword" required autocomplete="new-password" minlength="8">
        </label>
        <label class="field">
          <label>Confirmar</label>
          <input type="password" name="confirmPassword" required autocomplete="new-password" minlength="8">
        </label>
        <button class="btn primary" type="submit" id="submit" style="width:100%;justify-content:center;padding:.7rem">Guardar nova palavra-passe</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/shared/api.js';
    const form = document.getElementById('form');
    const err  = document.getElementById('err');
    const btn  = document.getElementById('submit');

    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      // No token in the URL → render an error and don't show the form.
      document.querySelector('.auth-card').innerHTML = `
        <span class="eyebrow" style="color:var(--stamp)">Diernus · Link inválido</span>
        <h1>Link inválido</h1>
        <p class="lede">Não foi possível encontrar o token de recuperação. Confirme que copiou o link completo do email.</p>
        <p style="margin-top:1.4rem"><a href="/forgot-password.html" style="color:var(--cobalt);font-size:.88rem">Pedir um novo link</a></p>
      `;
    } else {
      form.addEventListener('submit', async e => {
        e.preventDefault();
        err.style.display = 'none';
        btn.disabled = true; btn.textContent = 'A guardar…';
        const fd = new FormData(form);
        const newPassword = fd.get('newPassword');
        const confirmPassword = fd.get('confirmPassword');
        if (newPassword !== confirmPassword) {
          err.textContent = 'A confirmação não coincide com a nova palavra-passe';
          err.style.display = '';
          btn.disabled = false; btn.textContent = 'Guardar nova palavra-passe';
          return;
        }
        try {
          await api.resetPassword(token, newPassword);
          document.querySelector('.auth-card').innerHTML = `
            <span class="eyebrow" style="color:#1e8e3e">Diernus · Palavra-passe alterada</span>
            <h1>Tudo pronto</h1>
            <p class="lede">A sua palavra-passe foi alterada. Já pode iniciar sessão com a nova credencial.</p>
            <p style="margin-top:1.4rem"><a class="btn primary" href="/login.html" style="display:inline-block;text-decoration:none">Ir para início de sessão</a></p>
          `;
        } catch (e) {
          err.textContent = e.message;
          err.style.display = '';
          btn.disabled = false; btn.textContent = 'Guardar nova palavra-passe';
        }
      });
    }
  </script>
</body>
</html>
